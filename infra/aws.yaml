{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Naturedex static Astro frontend: private S3, CloudFront OAC, HTTPS, directory indexes, and true 404 responses. No application server or CMS resources.",
  "Parameters": {
    "DomainName": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+$",
      "Description": "Optional lowercase hostname without scheme/path. Supply CertificateArn at the same time."
    },
    "CertificateArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[A-Za-z0-9-]+$",
      "Description": "Optional issued ACM certificate in us-east-1 covering DomainName."
    },
    "PriceClass": {
      "Type": "String",
      "Default": "PriceClass_100",
      "AllowedValues": [
        "PriceClass_100",
        "PriceClass_200",
        "PriceClass_All"
      ],
      "Description": "CloudFront edge-location price class; this does not cap spending."
    }
  },
  "Rules": {
    "DomainCertificatePair": {
      "Assertions": [
        {
          "Assert": {
            "Fn::Or": [
              {
                "Fn::And": [
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "DomainName"
                      },
                      ""
                    ]
                  },
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "CertificateArn"
                      },
                      ""
                    ]
                  }
                ]
              },
              {
                "Fn::And": [
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "DomainName"
                          },
                          ""
                        ]
                      }
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "CertificateArn"
                          },
                          ""
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "AssertDescription": "Supply both DomainName and CertificateArn, or leave both blank."
        }
      ]
    }
  },
  "Conditions": {
    "HasCustomDomain": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "DomainName"
            },
            ""
          ]
        }
      ]
    }
  },
  "Resources": {
    "OriginBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "IgnorePublicAcls": true,
          "BlockPublicPolicy": true,
          "RestrictPublicBuckets": true
        },
        "OwnershipControls": {
          "Rules": [
            {
              "ObjectOwnership": "BucketOwnerEnforced"
            }
          ]
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "LifecycleConfiguration": {
          "Rules": [
            {
              "Id": "AbortIncompleteUploads",
              "Status": "Enabled",
              "AbortIncompleteMultipartUpload": {
                "DaysAfterInitiation": 7
              }
            }
          ]
        }
      }
    },
    "OriginAccessControl": {
      "Type": "AWS::CloudFront::OriginAccessControl",
      "Properties": {
        "OriginAccessControlConfig": {
          "Name": {
            "Fn::Join": [
              "-",
              [
                "naturedex",
                {
                  "Fn::Select": [
                    2,
                    {
                      "Fn::Split": [
                        "/",
                        {
                          "Ref": "AWS::StackId"
                        }
                      ]
                    }
                  ]
                },
                "oac"
              ]
            ]
          },
          "OriginAccessControlOriginType": "s3",
          "SigningBehavior": "always",
          "SigningProtocol": "sigv4"
        }
      }
    },
    "DirectoryIndexFunction": {
      "Type": "AWS::CloudFront::Function",
      "Properties": {
        "Name": {
          "Fn::Join": [
            "-",
            [
              "naturedex",
              {
                "Fn::Select": [
                  2,
                  {
                    "Fn::Split": [
                      "/",
                      {
                        "Ref": "AWS::StackId"
                      }
                    ]
                  }
                ]
              },
              "indexes"
            ]
          ]
        },
        "AutoPublish": true,
        "FunctionConfig": {
          "Comment": "Map Astro directory URLs to their index.html object without rewriting assets.",
          "Runtime": "cloudfront-js-2.0"
        },
        "FunctionCode": "function handler(event) {\n  var request = event.request;\n  var uri = request.uri;\n  if (uri.endsWith('/')) {\n    request.uri = uri + 'index.html';\n  } else {\n    var last = uri.substring(uri.lastIndexOf('/') + 1);\n    if (last.indexOf('.') === -1) request.uri = uri + '/index.html';\n  }\n  return request;\n}"
      }
    },
    "StaticCachePolicy": {
      "Type": "AWS::CloudFront::CachePolicy",
      "Properties": {
        "CachePolicyConfig": {
          "Name": {
            "Fn::Join": [
              "-",
              [
                "naturedex",
                {
                  "Fn::Select": [
                    2,
                    {
                      "Fn::Split": [
                        "/",
                        {
                          "Ref": "AWS::StackId"
                        }
                      ]
                    }
                  ]
                },
                "cache"
              ]
            ]
          },
          "MinTTL": 0,
          "DefaultTTL": 300,
          "MaxTTL": 31536000,
          "ParametersInCacheKeyAndForwardedToOrigin": {
            "EnableAcceptEncodingBrotli": true,
            "EnableAcceptEncodingGzip": true,
            "CookiesConfig": {
              "CookieBehavior": "none"
            },
            "HeadersConfig": {
              "HeaderBehavior": "none"
            },
            "QueryStringsConfig": {
              "QueryStringBehavior": "none"
            }
          }
        }
      }
    },
    "SecurityHeaders": {
      "Type": "AWS::CloudFront::ResponseHeadersPolicy",
      "Properties": {
        "ResponseHeadersPolicyConfig": {
          "Name": {
            "Fn::Join": [
              "-",
              [
                "naturedex",
                {
                  "Fn::Select": [
                    2,
                    {
                      "Fn::Split": [
                        "/",
                        {
                          "Ref": "AWS::StackId"
                        }
                      ]
                    }
                  ]
                },
                "headers"
              ]
            ]
          },
          "SecurityHeadersConfig": {
            "ContentSecurityPolicy": {
              "Override": true,
              "ContentSecurityPolicy": "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.contentstack.io https://eu-images.contentstack.com https://au-images.contentstack.com https://azure-na-images.contentstack.com https://azure-eu-images.contentstack.com https://gcp-na-images.contentstack.com https://gcp-eu-images.contentstack.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
            },
            "ContentTypeOptions": {
              "Override": true
            },
            "FrameOptions": {
              "FrameOption": "DENY",
              "Override": true
            },
            "ReferrerPolicy": {
              "ReferrerPolicy": "strict-origin-when-cross-origin",
              "Override": true
            },
            "StrictTransportSecurity": {
              "AccessControlMaxAgeSec": 31536000,
              "IncludeSubdomains": false,
              "Preload": false,
              "Override": true
            }
          }
        }
      }
    },
    "Distribution": {
      "Type": "AWS::CloudFront::Distribution",
      "Properties": {
        "DistributionConfig": {
          "Enabled": true,
          "Comment": "Naturedex static frontend; Contentstack is managed separately.",
          "DefaultRootObject": "index.html",
          "HttpVersion": "http2and3",
          "IPV6Enabled": true,
          "PriceClass": {
            "Ref": "PriceClass"
          },
          "Aliases": {
            "Fn::If": [
              "HasCustomDomain",
              [
                {
                  "Ref": "DomainName"
                }
              ],
              {
                "Ref": "AWS::NoValue"
              }
            ]
          },
          "ViewerCertificate": {
            "Fn::If": [
              "HasCustomDomain",
              {
                "AcmCertificateArn": {
                  "Ref": "CertificateArn"
                },
                "SslSupportMethod": "sni-only",
                "MinimumProtocolVersion": "TLSv1.2_2021"
              },
              {
                "CloudFrontDefaultCertificate": true
              }
            ]
          },
          "Origins": [
            {
              "Id": "PrivateS3",
              "DomainName": {
                "Fn::GetAtt": [
                  "OriginBucket",
                  "RegionalDomainName"
                ]
              },
              "OriginAccessControlId": {
                "Fn::GetAtt": [
                  "OriginAccessControl",
                  "Id"
                ]
              },
              "S3OriginConfig": {
                "OriginAccessIdentity": ""
              }
            }
          ],
          "DefaultCacheBehavior": {
            "TargetOriginId": "PrivateS3",
            "ViewerProtocolPolicy": "redirect-to-https",
            "AllowedMethods": [
              "GET",
              "HEAD"
            ],
            "CachedMethods": [
              "GET",
              "HEAD"
            ],
            "Compress": true,
            "CachePolicyId": {
              "Ref": "StaticCachePolicy"
            },
            "ResponseHeadersPolicyId": {
              "Ref": "SecurityHeaders"
            },
            "FunctionAssociations": [
              {
                "EventType": "viewer-request",
                "FunctionARN": {
                  "Fn::GetAtt": [
                    "DirectoryIndexFunction",
                    "FunctionARN"
                  ]
                }
              }
            ]
          },
          "CustomErrorResponses": [
            {
              "ErrorCode": 403,
              "ResponseCode": 404,
              "ResponsePagePath": "/404.html",
              "ErrorCachingMinTTL": 30
            },
            {
              "ErrorCode": 404,
              "ResponseCode": 404,
              "ResponsePagePath": "/404.html",
              "ErrorCachingMinTTL": 30
            }
          ]
        }
      }
    },
    "OriginBucketPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "OriginBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "CloudFrontOnly",
              "Effect": "Allow",
              "Principal": {
                "Service": "cloudfront.amazonaws.com"
              },
              "Action": "s3:GetObject",
              "Resource": {
                "Fn::Sub": "${OriginBucket.Arn}/*"
              },
              "Condition": {
                "StringEquals": {
                  "AWS:SourceArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
                  }
                }
              }
            },
            {
              "Sid": "DenyInsecureTransport",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": [
                {
                  "Fn::GetAtt": [
                    "OriginBucket",
                    "Arn"
                  ]
                },
                {
                  "Fn::Sub": "${OriginBucket.Arn}/*"
                }
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false"
                }
              }
            }
          ]
        }
      }
    }
  },
  "Outputs": {
    "BucketName": {
      "Value": {
        "Ref": "OriginBucket"
      },
      "Description": "Upload only the reviewed dist/ artifact to this bucket."
    },
    "DistributionId": {
      "Value": {
        "Ref": "Distribution"
      }
    },
    "DistributionDomain": {
      "Value": {
        "Fn::GetAtt": [
          "Distribution",
          "DomainName"
        ]
      }
    },
    "SiteUrl": {
      "Value": {
        "Fn::If": [
          "HasCustomDomain",
          {
            "Fn::Sub": "https://${DomainName}"
          },
          {
            "Fn::Sub": "https://${Distribution.DomainName}"
          }
        ]
      }
    }
  }
}
